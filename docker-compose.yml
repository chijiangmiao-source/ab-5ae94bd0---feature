# Compose：常驻 Web 服务（端口可配置）+ 一次性 verify 服务。
#
# 常驻页面：
#   HOST_PORT=9090 docker compose up --build web
#   然后访问 http://localhost:9090/ ，健康检查 http://localhost:9090/healthz
#
# 一次性校验（求解器测试 + 生产构建 + HTTP 冒烟，以退出码结束）：
#   docker compose up --build verify
#   echo $?        # 0 表示全部通过
services:
  web:
    build:
      context: .
      target: runtime
    image: isa-clone-web:latest
    environment:
      # 容器内监听端口（可与宿主端口不同）
      HOST: 0.0.0.0
      HOST_PORT: 8080
    ports:
      # 宿主端口通过 HOST_PORT 配置（默认 8080），映射到容器 8080
      - "${HOST_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 一次性服务：执行求解器测试、固定歧义/冲突样例核对、生产构建与 HTTP 冒烟，
  # 输出结果后以退出码结束（不会常驻）。
  verify:
    build:
      context: .
      target: build
    image: isa-clone-verify:latest
    working_dir: /app
    command: ["sh", "verify.sh"]
    environment:
      HOST: 127.0.0.1
      # 冒烟阶段容器内静态服务器使用的端口
      SMOKE_PORT: "8099"
